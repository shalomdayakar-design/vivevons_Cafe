        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                console.error("VIVEVONS App Error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-espresso text-cream flex items-center justify-center p-6 text-center">
                            <div className="max-w-md space-y-4">
                                <h2 className="font-serif text-3xl uppercase text-terracotta">VIVEVONS SANCTUARY</h2>
                                <p className="font-sans text-xs text-sage">Application experienced a minor state error. Click below to refresh.</p>
                                <button onClick={() => window.location.reload()} className="px-6 py-3 bg-terracotta text-cream rounded-full text-xs font-mono uppercase active:scale-95 transition-transform">
                                    RELOAD SANCTUARY
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }

            { id: 't5', num: '05', title: 'THE BEGINNING AGAIN', sub: 'For anyone ready to start something new.', desc: 'Our signature window table overlooking the street. Dedicated to second chances — pivot your career, rewrite your project, or launch a fresh start.', quote: '"You don’t have to stay who you were yesterday."', tags: ['New Ventures', 'Fresh Starts'], img: 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?q=80&w=1200&auto=format&fit=crop' }

            { id: '1', name: 'Elena R.', title: 'A sustainable ceramics studio', msg: 'Quitting corporate finance. Sitting at Table 03, sketching my kiln layout.', cat: 'UNFINISHED DREAMS', likes: 24, status: 'APPROVED' },

            phone: '+1 (555) 848-3866',

        };

        const DEFAULT_HOURS = [
            { dayName: 'Monday', openTime: '07:30', closeTime: '22:00', isClosed: false },
            { dayName: 'Tuesday', openTime: '07:30', closeTime: '22:00', isClosed: false },
            { dayName: 'Wednesday', openTime: '07:30', closeTime: '22:00', isClosed: false },
            { dayName: 'Thursday', openTime: '07:30', closeTime: '22:00', isClosed: false },
            { dayName: 'Friday', openTime: '07:30', closeTime: '22:00', isClosed: false },
            { dayName: 'Saturday', openTime: '08:00', closeTime: '23:00', isClosed: false },
            { dayName: 'Sunday', openTime: '08:00', closeTime: '23:00', isClosed: false }
        ];

        class DatabaseService {
            constructor() {
                this.listeners = new Set();
                this.init();
            }
            subscribe(cb) { this.listeners.add(cb); return () => this.listeners.delete(cb); }
            notify() { this.listeners.forEach(cb => cb()); }
            get(k, fb) { try { const d = localStorage.getItem(`vv_${k}`); return d ? JSON.parse(d) : fb; } catch { return fb; } }
            set(k, v) { try { localStorage.setItem(`vv_${k}`, JSON.stringify(v)); this.notify(); } catch(e){} }
            init() {
                if (!localStorage.getItem('vv_init_v9')) {
                    this.set('menu', DEFAULT_MENU);
                    this.set('gallery', DEFAULT_GALLERY);
                    this.set('tables', DEFAULT_TABLES);
                    this.set('ideas', DEFAULT_IDEAS);
                    this.set('contact', DEFAULT_CONTACT);
                    this.set('hours', DEFAULT_HOURS);
                    this.set('reservations', []);
                    this.set('logs', [{ id: '1', email: 'owner@vivevons.com', role: 'SUPER_ADMIN', action: 'CMS_INIT', details: 'Database initialized', timestamp: new Date().toLocaleString() }]);
                    this.set('users', [
                        { id: '1', email: 'owner@vivevons.com', fullName: 'Founder & Owner', role: 'SUPER_ADMIN', isActive: true },
                        { id: '2', email: 'manager@vivevons.com', fullName: 'General Manager', role: 'ADMIN', isActive: true },
                        { id: '3', email: 'editor@vivevons.com', fullName: 'Content Editor', role: 'EDITOR', isActive: true }
                    ]);
                    localStorage.setItem('vv_init_v9', 'true');
                }
            }
            getMenuItems(pubOnly = true) {
                const list = this.get('menu', DEFAULT_MENU);
                return pubOnly ? list.filter(i => i.availability !== 'HIDDEN' && !i.deletedAt) : list;
            }
            saveMenuItem(item) {
                const list = this.getMenuItems(false);
                if (item.id) {
                    const idx = list.findIndex(i => i.id === item.id);
                    list[idx] = { ...list[idx], ...item };
                } else {
                    list.unshift({ ...item, id: `item-${Date.now()}` });
                }
                this.set('menu', list);
            }
            deleteMenuItem(id) {
                this.set('menu', this.getMenuItems(false).filter(i => i.id !== id));
            }
            getGallery(pubOnly = true) {
                const list = this.get('gallery', DEFAULT_GALLERY);
                return pubOnly ? list.filter(g => g.isPublished) : list;
            }
            saveGallery(img) {
                const list = this.getGallery(false);
                if (img.id) {
                    const idx = list.findIndex(g => g.id === img.id);
                    list[idx] = { ...list[idx], ...img };
                } else {
                    list.unshift({ ...img, id: `g-${Date.now()}` });
                }
                this.set('gallery', list);
            }
            deleteGallery(id) {
                this.set('gallery', this.getGallery(false).filter(g => g.id !== id));
            }
            getTables() { return this.get('tables', DEFAULT_TABLES); }
            saveTable(t) {
                const list = this.getTables();
                const idx = list.findIndex(x => x.id === t.id);
                if (idx !== -1) { list[idx] = t; this.set('tables', list); }
            }
            getIdeas(statusFilter = 'ALL') {
                const list = this.get('ideas', DEFAULT_IDEAS);
                return statusFilter === 'ALL' ? list : list.filter(i => i.status === statusFilter);
            }
            submitIdea(idea) {
                const list = this.getIdeas('ALL');
                const newObj = { ...idea, id: `idea-${Date.now()}`, likes: 1, status: 'PENDING' };
                list.unshift(newObj);
                this.set('ideas', list);
            }
            updateIdeaStatus(id, status) {
                const list = this.getIdeas('ALL');
                const idx = list.findIndex(i => i.id === id);
                if (idx !== -1) { list[idx].status = status; this.set('ideas', list); }
            }
            getReservations(statusFilter = 'ALL') {
                const list = this.get('reservations', []);
                return statusFilter === 'ALL' ? list : list.filter(r => r.status === statusFilter);
            }
            submitReservation(res) {
                const list = this.getReservations('ALL');
                const newRes = { ...res, id: `res-${Date.now()}`, bookingRef: `VV-${Math.floor(100000 + Math.random() * 900000)}`, status: 'PENDING', createdAt: new Date().toLocaleString() };
                list.unshift(newRes);
                this.set('reservations', list);
                return newRes;
            }
            updateReservationStatus(id, status) {
                const list = this.getReservations('ALL');
                const idx = list.findIndex(r => r.id === id);
                if (idx !== -1) { list[idx].status = status; this.set('reservations', list); }
            }
            getContact() { return this.get('contact', DEFAULT_CONTACT); }
            saveContact(c) { this.set('contact', c); }
            getHours() { return this.get('hours', DEFAULT_HOURS); }
            saveHours(h) { this.set('hours', h); }
            getLogs() { return this.get('logs', []); }
            log(email, role, action, details) {
                const list = this.getLogs();
                list.unshift({ id: `log-${Date.now()}`, email, role, action, details, timestamp: new Date().toLocaleString() });
                this.set('logs', list.slice(0, 100));
            }
            getUsers() { return this.get('users', []); }
            saveUser(u) {
                const list = this.getUsers();
                if (u.id) {
                    const idx = list.findIndex(x => x.id === u.id);
                    list[idx] = { ...list[idx], ...u };
                } else {
                    list.push({ ...u, id: `usr-${Date.now()}`, isActive: true });
                }
                this.set('users', list);
            }
        }

        const db = new DatabaseService();

        // Auth helper
        const auth = {
            getUser() {
                try { return JSON.parse(localStorage.getItem('vv_auth')); } catch { return null; }
            },
            login(email, pass) {
                const users = db.getUsers();
                const u = users.find(x => x.email.toLowerCase() === email.trim().toLowerCase());
                if (!u) return { success: false, error: 'User not found.' };
                if (pass !== 'vivevons2026') return { success: false, error: 'Invalid password. (Use: vivevons2026)' };
                localStorage.setItem('vv_auth', JSON.stringify(u));
                db.log(u.email, u.role, 'LOGIN', 'Admin logged into CMS console.');
                return { success: true, user: u };
            },
            logout() {
                const u = auth.getUser();
                if (u) db.log(u.email, u.role, 'LOGOUT', 'Admin session ended.');
                localStorage.removeItem('vv_auth');
            }
        };

        // --- STEAMING COFFEE PRELOADER ANIMATION ---
        const SteamingCoffeePreloader = ({ onComplete }) => {
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                const interval = setInterval(() => {
                    setProgress((prev) => {
                        if (prev >= 100) {
                            clearInterval(interval);
                            setTimeout(onComplete, 400);
                            return 100;
                        }
                        return prev + 12;
                    });
                }, 100);
                return () => clearInterval(interval);
            }, [onComplete]);

            return (
                <div className="fixed inset-0 z-[100] bg-espresso text-cream flex flex-col items-center justify-between p-6 md:p-16 select-none transition-opacity duration-700 paper-grain">
                    <div className="text-[10px] sm:text-xs font-mono uppercase tracking-[0.3em] text-sage">EST. 2026 — VIVEVONS SANCTUARY</div>

                        <div className="relative w-28 h-28 sm:w-32 sm:h-32 flex items-center justify-center">

                                <div className="w-1.5 h-12 bg-terracotta/60 rounded-full blur-[2px] animate-steam" style={{ animationDelay: '0.4s' }} />
                                <div className="w-1.5 h-10 bg-cream/40 rounded-full blur-[2px] animate-steam" style={{ animationDelay: '0.8s' }} />
                            </div>

                            <div className="relative z-10 flex flex-col items-center">
                                <div className="relative w-16 h-14 sm:w-20 sm:h-16 bg-cream/15 border-2 border-cream/30 rounded-b-3xl shadow-2xl flex items-center justify-center backdrop-blur-md">
                                    <div className="w-12 h-3 sm:w-16 sm:h-4 bg-walnut/90 rounded-full border border-terracotta/40" />
                                    <div className="absolute -right-3 top-2 w-3.5 h-7 sm:w-4 sm:h-8 border-2 border-cream/30 rounded-r-full" />
                                </div>
                                <div className="w-20 h-2 sm:w-24 sm:h-2.5 bg-cream/20 rounded-full border border-cream/30 mt-1 shadow-lg" />
                            </div>
                        </div>

                        <div className="space-y-2">
                            <h1 className="font-serif text-3xl sm:text-5xl md:text-6xl font-light tracking-[0.2em] uppercase text-cream">VIVEVONS</h1>
                            <p className="font-hand text-xl sm:text-2xl text-terracotta">“Brewing your second chance...”</p>
                        </div>
                    </div>

                    <div className="w-full max-w-xs space-y-3">
                        <div className="flex justify-between items-center text-[10px] sm:text-xs font-mono text-sage">
                            <span>BREWING EXPERIENCE</span>
                            <span>{Math.min(progress, 100)}%</span>
                        </div>
                        <div className="h-1 w-full bg-cream/10 rounded-full overflow-hidden">
                            <div className="h-full bg-terracotta transition-all duration-200" style={{ width: `${Math.min(progress, 100)}%` }} />
                        </div>
                    </div>
                </div>
            );
        };

        // --- NATIVE WEB AUDIO AMBIENCE ---
        let audioCtx = null;
        let noiseNode = null;
        let gainNode = null;

        const toggleAudioAmbience = (enable) => {
            if (enable) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const bufferSize = audioCtx.sampleRate * 2;
                    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    noiseNode = audioCtx.createBufferSource();
                    noiseNode.buffer = noiseBuffer;
                    noiseNode.loop = true;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 400;

                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = 0.04;

                    noiseNode.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    noiseNode.start(0);
                    return true;
                } catch(e) { return false; }
            } else {

                                    <div>
                                        <label className="block text-xs uppercase text-walnut mb-1">City & Postal Code</label>
                                        <input type="text" value={contactData.city} onChange={e => setContactData({...contactData, city: e.target.value})} className="w-full p-3 rounded-xl bg-offwhite border text-base sm:text-xs" required />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs uppercase text-walnut mb-1">Phone Number</label>
                                            <input type="text" value={contactData.phone} onChange={e => setContactData({...contactData, phone: e.target.value})} className="w-full p-3 rounded-xl bg-offwhite border text-base sm:text-xs font-mono font-semibold text-olive" required />
                                        </div>
                                        <div>
                                            <label className="block text-xs uppercase text-walnut mb-1">Email Address</label>
                                            <input type="email" value={contactData.email} onChange={e => setContactData({...contactData, email: e.target.value})} className="w-full p-3 rounded-xl bg-offwhite border text-base sm:text-xs font-mono" required />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs uppercase text-walnut mb-1">Google Maps URL</label>
                                        <input type="text" value={contactData.googleMapsUrl} onChange={e => setContactData({...contactData, googleMapsUrl: e.target.value})} className="w-full p-3 rounded-xl bg-offwhite border text-base sm:text-xs font-mono text-terracotta" required />
                                    </div>

                                    <button type="submit" className="w-full py-4 bg-olive text-cream rounded-xl text-xs font-sans tracking-widest uppercase font-semibold active:scale-95">SAVE CONTACT DETAILS</button>
                                </form>

                                <form onSubmit={handleSaveHours} className="bg-cream p-6 sm:p-8 rounded-2xl border border-olive/15 space-y-4">
                                    <h3 className="font-serif text-xl sm:text-2xl text-olive uppercase border-b border-olive/15 pb-3">WEEKLY OPENING HOURS</h3>
                                    <div className="space-y-3">
                                        {hoursList.map((h, idx) => (
                                            <div key={h.dayName} className="p-3 rounded-xl bg-offwhite border border-olive/10 flex items-center justify-between text-xs">
                                                <span className="font-mono text-olive font-semibold w-20 sm:w-24">{h.dayName}</span>
                                                <div className="flex items-center space-x-1.5 sm:space-x-2 font-mono">
                                                    <input type="text" disabled={h.isClosed} value={h.openTime} onChange={e => { const list = [...hoursList]; list[idx].openTime = e.target.value; setHoursList(list); }} className="w-14 sm:w-16 p-1 rounded bg-cream border text-center text-xs" />
                                                    <span>to</span>
                                                    <input type="text" disabled={h.isClosed} value={h.closeTime} onChange={e => { const list = [...hoursList]; list[idx].closeTime = e.target.value; setHoursList(list); }} className="w-14 sm:w-16 p-1 rounded bg-cream border text-center text-xs" />
                                                </div>
                                                <label className="flex items-center space-x-1 font-mono text-[10px]">
                                                    <input type="checkbox" checked={h.isClosed} onChange={e => { const list = [...hoursList]; list[idx].isClosed = e.target.checked; setHoursList(list); }} />
                                                    <span>Closed</span>
                                                </label>
                                            </div>
                                        ))}
                                    </div>
                                    <button type="submit" className="w-full py-4 bg-olive text-cream rounded-xl text-xs font-sans tracking-widest uppercase font-semibold active:scale-95">SAVE OPENING HOURS</button>
                                </form>
                            </div>
                        )}

                        {/* TAB: ACTIVITY LOGS */}
                        {activeTab === 'logs' && (
                            <div className="bg-cream rounded-2xl border border-olive/15 overflow-x-auto">
                                <table className="w-full text-left text-xs font-sans min-w-[500px]">
                                    <thead className="bg-offwhite border-b border-olive/15 font-mono text-[10px] text-walnut uppercase">
                                        <tr>
                                            <th className="p-4">Timestamp</th>
                                            <th className="p-4">Admin Email</th>
                                            <th className="p-4">Action</th>
                                            <th className="p-4">Details</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-olive/10 font-mono text-[11px]">
                                        {logsList.map(log => (
                                            <tr key={log.id}>
                                                <td className="p-4 text-walnut">{log.timestamp}</td>
                                                <td className="p-4 text-olive font-semibold">{log.email}</td>
                                                <td className="p-4 font-sans font-semibold text-espresso">{log.action}</td>
                                                <td className="p-4 font-sans text-espresso/80">{log.details}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* EDIT MODAL FOR MENU */}
                        {editMenu && (
                            <div className="fixed inset-0 z-50 bg-espresso/80 backdrop-blur-md flex items-center justify-center p-4">
                                <div className="bg-offwhite max-w-md w-full rounded-3xl p-6 sm:p-8 border border-olive/20 space-y-4">
                                    <h3 className="font-serif text-2xl text-olive uppercase">EDIT MENU ITEM</h3>
                                    <input type="text" placeholder="Creative Title" value={editMenu.creativeName} onChange={e => setEditMenu({...editMenu, creativeName: e.target.value})} className="w-full p-3 rounded-xl bg-cream border text-base sm:text-xs" />
                                    <input type="text" placeholder="Normal Title" value={editMenu.normalName} onChange={e => setEditMenu({...editMenu, normalName: e.target.value})} className="w-full p-3 rounded-xl bg-cream border text-base sm:text-xs" />
                                    <input type="text" placeholder="Price" value={editMenu.price} onChange={e => setEditMenu({...editMenu, price: e.target.value})} className="w-full p-3 rounded-xl bg-cream border text-base sm:text-xs font-mono font-semibold text-terracotta" />
                                    <select value={editMenu.availability} onChange={e => setEditMenu({...editMenu, availability: e.target.value})} className="w-full p-3 rounded-xl bg-cream border text-base sm:text-xs">
                                        <option value="AVAILABLE">AVAILABLE</option>
                                        <option value="SOLD_OUT">SOLD OUT</option>
                                        <option value="HIDDEN">HIDDEN</option>
                                    </select>
                                    <textarea placeholder="Description" value={editMenu.description} onChange={e => setEditMenu({...editMenu, description: e.target.value})} className="w-full p-3 rounded-xl bg-cream border text-base sm:text-xs" rows="3" />
                                    <div className="flex gap-2">
                                        <button onClick={() => { db.saveMenuItem(editMenu); setEditMenu(null); showToast('✓ Menu item saved & published!'); }} className="flex-1 py-3 bg-olive text-cream rounded-xl text-xs uppercase font-semibold active:scale-95">SAVE & PUBLISH</button>
                                        <button onClick={() => setEditMenu(null)} className="py-3 px-4 bg-cream text-espresso rounded-xl text-xs">CANCEL</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* EDIT MODAL FOR GALLERY */}
                        {editGallery && (
                            <div className="fixed inset-0 z-50 bg-espresso/80 backdrop-blur-md flex items-center justify-center p-4">
                                <div className="bg-offwhite max-w-md w-full rounded-3xl p-6 sm:p-8 border border-olive/20 space-y-4">
                                    <h3 className="font-serif text-2xl text-olive uppercase">UPLOAD PHOTO</h3>
                                    <input type="text" placeholder="Photo Title" value={editGallery.title} onChange={e => setEditGallery({...editGallery, title: e.target.value})} className="w-full p-3 rounded-xl bg-cream border text-base sm:text-xs" />
                                    <input type="text" placeholder="Image URL" value={editGallery.image} onChange={e => setEditGallery({...editGallery, image: e.target.value})} className="w-full p-3 rounded-xl bg-cream border text-base sm:text-xs font-mono" />
                                    <div className="flex gap-2">
                                        <button onClick={() => { db.saveGallery(editGallery); setEditGallery(null); showToast('✓ Photo published to gallery!'); }} className="flex-1 py-3 bg-olive text-cream rounded-xl text-xs uppercase font-semibold active:scale-95">PUBLISH PHOTO</button>
                                        <button onClick={() => setEditGallery(null)} className="py-3 px-4 bg-cream text-espresso rounded-xl text-xs">CANCEL</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        // --- APP MAIN ROUTER & IMMERSIVE STATE ---
        const AppRouter = () => {
            const [route, setRoute] = useState(window.location.hash || '#');
            const [isLoading, setIsLoading] = useState(true);
            const [personalization, setPersonalization] = useState('coffee');
            const [isAudioOn, setIsAudioOn] = useState(false);

            useEffect(() => {
                const handleHash = () => setRoute(window.location.hash || '#');
                window.addEventListener('hashchange', handleHash);
                return () => window.removeEventListener('hashchange', handleHash);
            }, []);

            const handleToggleAudio = () => {
                const newState = !isAudioOn;
                const active = toggleAudioAmbience(newState);
                setIsAudioOn(active);
            };

            if (route.startsWith('#admin')) {
                return <AdminCMS />;
            }

            return (
                <div className="relative min-h-screen bg-offwhite text-espresso">
                    <CustomCursor />

                    {/* Steaming Coffee Loading Animation */}
                    {isLoading && (
                        <SteamingCoffeePreloader onComplete={() => setIsLoading(false)} />
                    )}

                    <div className={isLoading ? 'opacity-0 h-screen overflow-hidden' : 'opacity-100 transition-opacity duration-700'}>
                        <PublicNavbar
                            onOpenReservation={() => { const el = document.getElementById('reservation'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }}
                            isAudioOn={isAudioOn}
                            onToggleAudio={handleToggleAudio}
                        />

                        <main>
                            <InteractiveHero onOpenReservation={() => { const el = document.getElementById('reservation'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }} />
                            <PersonalizationBar selected={personalization} onSelect={setPersonalization} />
                            <SketchToRealitySection />
                            <InteractiveTimeline />
                            <IdeaDesk />
                            <BrandStory />
                            <FiveTables />
                            <PublicMenu />
                            <IdeaWall />
                            <Gallery />
                            <TakeABreath />
                            <ConversationalReservation />
                            <PublicLocation />
                            <FinalClosingSection onOpenReservation={() => { const el = document.getElementById('reservation'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }} />
                        </main>

                        <PublicFooter onOpenReservation={() => { const el = document.getElementById('reservation'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }} />
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <AppRouter />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
